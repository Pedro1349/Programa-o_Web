<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <style>
        td {
            border: 1px solid;
            padding: 5px;
        }
        body {
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            display: flex;
        }
        .cervejas {
            height: 100%;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            display: flex;
        }
        .botoes {
            margin: 4px;
        }
    </style>

</head>



<body>

    <div style="display: flex;">
        <a class = "botoes" id = "linkCarregar" href="">Clique aqui para carregar as bebidas</a>
        <a class = "botoes" id = "linkOrdenar" href="">Mostrar bebidas ordenadas</a>
        <a class = "botoes" id = "linkEmbaralhar" href="">Mostrar bebidas embaralhadas</a>
    </div>
    <br>
    <div id="meu amor"></div>

</body>



<script>

    let bebidas = ["Cafe", "Agua", "Refrigerante"]

    const carregarDiv = (cervs) => {

        const div = document.getElementById("meu amor")
        const bebidasHtml = cervs.map(item => `<tr><td>${item}</tr></td>`)

        div.innerHTML = `
                <table id = "tabela">
                    <thead>
                        <tr style="background-color: limegreen;">
                            <th>
                                Nome
                            </th>
                        </tr>
                    </thead>
                    <tbody id ="elementos">
                    </tbody>
                </table>
            `
        let elementos = document.getElementById("elementos")
        elementos.innerHTML = `${bebidasHtml.join("")}`

    }

    const ordenarbebidas = (cervs) => {
        let bebidasOrdenadas = cervs.sort()

        let bebidasHtml = bebidasOrdenadas.map(item => `<tr><td>${item}</tr></td>`)

        let elementos = document.getElementById("elementos")
        elementos.innerHTML = `${bebidasHtml.join("")}`
    }

    function embaralhar (array) { 
        for (let i = array.length - 1; i > 0; i--) { 
            const j = Math.floor(Math.random() * (i + 1)); 
            [array[i], array[j]] = [array[j], array[i]]; 
        } 
        return array; 
    }; 

    const embaralharbebidas = (cervs) => {
        let bebidasEmbaralhadas = embaralhar(cervs)

        let bebidasHtml = bebidasEmbaralhadas.map(item => `<tr><td>${item}</tr></td>`)

        let elementos = document.getElementById("elementos")
        elementos.innerHTML = `${bebidasHtml.join("")}`
    }


    let linkCarregar = document.getElementById("linkCarregar")
    let linkOrdenar = document.getElementById("linkOrdenar")
    let linkEmbaralhar = document.getElementById("linkEmbaralhar")

    linkCarregar.addEventListener("click", (c) => {
        c.preventDefault()
        carregarDiv(bebidas)
    })
    
    linkOrdenar.addEventListener("click", (c) => {
        c.preventDefault()
        ordenarbebidas(bebidas)
    })
    
    linkEmbaralhar.addEventListener("click", (c) => {
        c.preventDefault()
        embaralharbebidas(bebidas)
    })

</script>

</html>
