<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <style>
        td {
            border: 1px solid;
            padding: 5px;
        }
        body {
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            display: flex;
        }
        .cervejas {
            height: 100%;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            display: flex;
        }
        .botoes {
            margin: 4px;
        }
    </style>

</head>



<body>

    <div style="display: flex;">
        <div class="botoes"><button id="botaoCarregar">Carregando cervejas...</button></div>
        <div class="botoes"><button id="botaoOrdenar">Mostrar cervejas ordenadas</button></div>
        <div class="botoes"><button id="botaoEmbaralhar">Mostrar cervejas embaralhadas</button></div>
    </div>
    <br>
    <div id="meu amor"></div>

</body>



<script>

    let cervejas = ["Guiness", "Desperados", "Becks"]

    const carregarDiv = (cervs) => {

        const div = document.getElementById("meu amor")
        const cervejasHtml = cervs.map(item => `<tr><td>${item}</tr></td>`)

        div.innerHTML = `
                <table id = "tabela">
                    <thead>
                        <tr style="background-color: limegreen;">
                            <th>
                                Nome
                            </th>
                        </tr>
                    </thead>
                    <tbody id ="elementos">
                    </tbody>
                </table>
            `
        let elementos = document.getElementById("elementos")
        elementos.innerHTML = `${cervejasHtml.join("")}`

    }

    const ordenarCervejas = (cervs) => {
        let cervejasOrdenadas = cervs.sort()

        let cervejasHtml = cervejasOrdenadas.map(transformarItem)

        let elementos = document.getElementById("elementos")
        elementos.innerHTML = `${cervejasHtml.join("")}`
    }

    function embaralhar (array) { 
        for (let i = array.length - 1; i > 0; i--) { 
            const j = Math.floor(Math.random() * (i + 1)); 
            [array[i], array[j]] = [array[j], array[i]]; 
        } 
        return array; 
    }; 

    const embaralharCervejas = (cervs) => {
        let cervejasEmbaralhadas = embaralhar(cervs)

        let cervejasHtml = cervejasEmbaralhadas.map(transformarItem)

        let elementos = document.getElementById("elementos")
        elementos.innerHTML = `${cervejasHtml.join("")}`
    }


    let botao = document.getElementById("botaoCarregar")
    let botaoOrdenar = document.getElementById("botaoOrdenar")
    let botaoEmbaralhar = document.getElementById("botaoEmbaralhar")

    botao.addEventListener("click", c => (carregarDiv(cervejas)))
    botaoOrdenar.addEventListener("click", c => (ordenarCervejas(cervejas)))
    botaoEmbaralhar.addEventListener("click", c => (embaralharCervejas(cervejas)))

</script>

</html>
