   <script>

        let textos = []
        let headers = ["title", "body", "userId", "id"]


        async function carregarTextos(){
                let res = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=3")

                textos = await res.json()

                const id = "textosDiv"

                carregarTable(textos, id, headers)
        }

      botao.addEventListener("click", () => carregarTextos() )
