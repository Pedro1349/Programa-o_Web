<!DOCTYPE html>

<html>   

   <head>
      <meta charset="UTF-8">      

      <style>

        body {
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            display: flex;
        }

        .caixa {
            height: 100%;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            display: flex;
            border: 1px solid;
            padding: 5px;
        }

        .titulo {
            background-color: limegreen;
            padding-left: 8px;
            padding-right: 8px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            display: flex;
            border-bottom: 2px solid;
        }

      </style>
   </head>



    <body>

        <div><button id="botaoCarregar">Carregando cervejas...</button></div>
        </br>
        <div id="cervejasDiv"></div>            
            
    </body>   

   

   <script type = "module">
        import { carregarTable } from "./tabelaGenerica.js";
        let cervejas = []
        let headers = ["title", "body", "userId", "id"]


        async function carregarCervejas(){
                let res = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=3")

                cervejas = await res.json()

                const id = "cervejasDiv"

                carregarTable(cervejas, id, headers)
        }


        const carregarDiv = cs => {

            const div = document.getElementById("cervejasDiv")

            const itensHtml = cs.map( ({title,body}) => `<div class="caixa"><div class="titulo"><span>Título:</span><p>${title}</p></div> <p>${body}</p></div>` ) 

            div.innerHTML = `${itensHtml.join("\n")}`

        }
    




      let botao = document.getElementById("botaoCarregar")

      botao.addEventListener("click", () => carregarCervejas() )                 



   </script>

</html>
