<!DOCTYPE html>

<html>   
   <head>
        <meta charset="UTF-8">   
        <title>Receita 6</title>

        <style>

            th {
                padding: 7px;
            }
            td {
                border: 1px solid;
                padding: 5px;
            }

            body {
                min-height: 100vh;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                display: flex;
            }

        </style> 
   </head>


   <body>
        <div><button id="botaoCarregar">Carregando cervejas...</button></div>
        </br>

        <div id="cervejasDiv"></div>            
   </body>   

   

   <script>
        let cervejas = [
            {
                teste: "Guiness",
                alcohol: "10%",
                style: "Imperial Stout",
                ibu: "40"
            },
            {
                name: "Desperados",
                teste4: "6%",
                style: "Lager",
                ibu: "24"
            },
            {
                name: "Becks",
                alcohol: "5%",
                teste3: "Red Ale",
                teste2: "20"
            }
        ]

        const carregarDiv = (cs, id, hd) => {
            const div = document.getElementById(id)

            div.innerHTML = `
                <table id = "tabela">
                    <thead>
                        <tr id = "t_header" style="background-color: limegreen;">
                        </tr>
                    </thead>
                    <tbody id ="elementos">
                    </tbody>
                </table>
            `

            let elementos = document.getElementById("elementos")
            const itensHtml = cs.map( item => `<tr><td>${item['name']}</td> <td>${item['alcohol']}</td> <td>${item['style']}</td> <td>${item['ibu']}</td></tr>` )
            elementos.innerHTML = `${itensHtml.join("")}`

            let cabecalho = document.getElementById("t_header")
            const headerHtml = hd.map( item => `<th>${item}</th>` ) 
            cabecalho.innerHTML = `${headerHtml.join("")}`

        }

        let botao = document.getElementById("botaoCarregar")

        botao.addEventListener("click", () => carregarDiv(
            cervejas = cervejas.map(cerv => ({...cerv, name: cerv.name ?? "N/A", alcohol: cerv.alcohol ?? "N/A", style: cerv.style ?? "N/A", ibu: cerv.ibu ?? "N/A"})),
            id = "cervejasDiv",
            head = ["Nome", "Álcool", "Estilo", "Amargor"]) )                 
   </script>
</html>
