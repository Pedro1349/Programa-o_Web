<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

</head>



<body>

    <div><button id="botaoCarregar">Carregando cervejas...</button></div>

    <div id="cervejasDiv"></div>

</body>



<script>



    let cervejas = []



    //cs é um array de cervejas

    const carregarDiv = cs => {

            const div = document.getElementById("cervejasDiv")

            const itensHtml = cs.map( ({title,body}) => `<div class="caixa"><div class="titulo"><span>Título:</span><p>${title}</p></div> <p>${body}</p></div>` ) 

            div.innerHTML = `${itensHtml.join("\n")}`

    }



    async function carregarCervejas() {

        try {

            let res = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=3")

            cervejas = await res.json()

            carregarDiv(cervejas)

        } catch (err) {

            document.getElementById("cervejasDiv").innerHTML = "Fudeu..."

        }

    }



    function carregarCervejas2() {

        fetch("https://jsonplaceholder.typicode.com/posts?_limit=3").then(
            res => res.json()
        ).then(
            json => carregarDiv(json)
        ).catch(
            err => document.getElementById("cervejasDiv").innerHTML = `Fudeu... ${err}`
        )

        document.getElementById("cervejasDiv").innerHTML = `Fazendo requisição`

    }





    let botao = document.getElementById("botaoCarregar")

    botao.addEventListener("click", () => carregarCervejas2())



</script>

</html>
